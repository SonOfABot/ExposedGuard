# Vulnerable site: serves everything, including dotfiles (nginx default behavior)
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html/vulnerable;
    index index.html;
}

# "Clean" SPA: catch-all answers any path with 200 + HTML (false-positive trap)
server {
    listen 8081;
    server_name _;
    root /usr/share/nginx/html/clean;
    index index.html;
    location / {
        try_files $uri /index.html;
    }
}
